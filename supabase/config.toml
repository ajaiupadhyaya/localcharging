# Supabase local config — linked to remote project via Cursor MCP / dashboard
# Run: npx supabase link --project-ref tnqyioeviefqswcqkavq (after supabase login)

project_id = "tnqyioeviefqswcqkavq"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["chargelocal://", "exp://127.0.0.1:8081"]

[storage]
enabled = true
